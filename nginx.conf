# TalentPro 前端部署 Nginx 配置示例
# 用法: 将此文件复制到 /etc/nginx/conf.d/talentpro.conf 并 reload
#
# 安全加固说明:
# - 已添加安全响应头（X-Frame-Options, X-Content-Type-Options 等）
# - 已配置 HSTS（仅 SSL 块）
# - 已配置 API 速率限制（10r/s，burst=20）
# - 已限制请求体大小为 50MB
# - 已屏蔽生产环境 Swagger 文档访问
# - 已更新 ssl_ciphers 为 Mozilla Intermediate 推荐套件

# 速率限制：基于客户端 IP 的 API 请求限制（需在 http 块内生效，conf.d 目录下文件满足此条件）
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 80;
  server_name talentpro.cn www.talentpro.cn;

  # 强制 HTTPS
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name talentpro.cn www.talentpro.cn;

  # SSL 证书路径（请替换为实际路径）
  ssl_certificate /etc/nginx/ssl/talentpro.cn.crt;
  ssl_certificate_key /etc/nginx/ssl/talentpro.cn.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Mozilla Intermediate 推荐密码套件（2024）
  # 来源: https://ssl-config.mozilla.org/
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;

  # HSTS：强制浏览器使用 HTTPS 访问（仅 SSL 配置块）
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  root /var/www/talentpro/dist;
  index index.html;

  # 请求体大小限制（支持文件上传）
  client_max_body_size 50m;

  # 全局安全响应头
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Gzip 压缩
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # 长期缓存：带 hash 的静态资源
  location ~* \.(js|css|woff2|png|svg|ico|webmanifest)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    # nginx 中 location 若存在 add_header 则不会继承父级，需显式重写安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # 字体文件
  location ~* \.(woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
    # nginx 中 location 若存在 add_header 则不会继承父级，需显式重写安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # 不缓存 HTML（SPA 路由需要）
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    # nginx 中 location 若存在 add_header 则不会继承父级，需显式重写安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # API 反向代理到 NestJS 后端
  location /api/ {
    proxy_pass http://localhost:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # API 速率限制：10r/s，突发 20 个请求不延迟
    limit_req zone=api burst=20 nodelay;
  }

  # SSE 长连接支持
  location /api/v1/notifications/stream {
    proxy_pass http://localhost:4000/api/v1/notifications/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # 生产环境屏蔽 Swagger 文档访问（返回 404）
  location ~ ^/api/docs {
    return 404;
  }

  # SPA 路由 fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
