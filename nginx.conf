# TalentPro 前端部署 Nginx 配置示例
# 用法: 将此文件复制到 /etc/nginx/conf.d/talentpro.conf 并 reload

server {
  listen 80;
  server_name talentpro.cn www.talentpro.cn;

  # 强制 HTTPS
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name talentpro.cn www.talentpro.cn;

  # SSL 证书路径（请替换为实际路径）
  ssl_certificate /etc/nginx/ssl/talentpro.cn.crt;
  ssl_certificate_key /etc/nginx/ssl/talentpro.cn.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  root /var/www/talentpro/dist;
  index index.html;

  # Gzip 压缩
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # 长期缓存：带 hash 的静态资源
  location ~* \.(js|css|woff2|png|svg|ico|webmanifest)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # 字体文件
  location ~* \.(woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
  }

  # 不缓存 HTML（SPA 路由需要）
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # API 反向代理到 NestJS 后端
  location /api/ {
    proxy_pass http://localhost:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # SSE 长连接支持
  location /api/v1/notifications/stream {
    proxy_pass http://localhost:4000/api/v1/notifications/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # SPA 路由 fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
