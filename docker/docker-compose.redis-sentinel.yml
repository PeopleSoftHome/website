# Redis Sentinel 高可用演练环境
# 用途：验证 BullMQ 在 Redis 主从切换后是否仍能正常生产和消费任务
# 用法：
#   cd talentpro-backend && node ../scripts/redis-bullmq-failover-drill.cjs
# 或手动：
#   docker compose -f docker/docker-compose.redis-sentinel.yml up -d

services:
  redis-master:
    image: redis:7-alpine
    container_name: talentpro-redis-master
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "6379:6379"
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-replica-1:
    image: redis:7-alpine
    container_name: talentpro-redis-replica-1
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000 --replicaof redis-master 6379
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-replica-2:
    image: redis:7-alpine
    container_name: talentpro-redis-replica-2
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000 --replicaof redis-master 6379
    ports:
      - "6381:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: talentpro-redis-sentinel-1
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2'
             > /etc/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 2000'
             >> /etc/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 5000'
             >> /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf --port 26379"
    ports:
      - "26379:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: talentpro-redis-sentinel-2
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2'
             > /etc/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 2000'
             >> /etc/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 5000'
             >> /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf --port 26379"
    ports:
      - "26380:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: talentpro-redis-sentinel-3
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2'
             > /etc/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 2000'
             >> /etc/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 5000'
             >> /etc/sentinel.conf &&
             redis-sentinel /etc/sentinel.conf --port 26379"
    ports:
      - "26381:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 10

networks:
  redis-ha:
    driver: bridge
