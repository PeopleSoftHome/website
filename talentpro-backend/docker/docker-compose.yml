version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talentpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentpro
      POSTGRES_PASSWORD: talentpro_dev
      POSTGRES_DB: talentpro
    ports:
      - "5432:5432"
    volumes:
      - talentpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentpro -d talentpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentpro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - talentpro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: talentpro-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: talentpro_meili_master_key
    ports:
      - "7700:7700"
    volumes:
      - talentpro_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-05-01T00-00-00Z
    container_name: talentpro-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: talentpro
      MINIO_ROOT_PASSWORD: talentpro_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - talentpro_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: talentpro-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://talentpro:talentpro_dev@postgres:5432/talentpro?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: talentpro_meili_master_key
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: talentpro
      MINIO_SECRET_KEY: talentpro_minio_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  talentpro_postgres_data:
  talentpro_redis_data:
  talentpro_meilisearch_data:
  talentpro_minio_data:
