version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talentpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentpro
      POSTGRES_PASSWORD: talentpro_dev
      POSTGRES_DB: talentpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentpro -d talentpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: talentpro-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: talentpro_meili_master_key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  minio:
    image: minio/minio:latest
    container_name: talentpro-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: talentpro
      MINIO_ROOT_PASSWORD: talentpro_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
