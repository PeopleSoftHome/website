version: '3.8'

# TalentPro 全栈开发环境（含测试数据）
# 用法：
#   docker-compose -f docker-compose.dev.yml up -d
#   前端：npm run dev（连接 http://localhost:4000）
#   后端 Swagger：http://localhost:4000/api/docs
#   Minio 控制台：http://localhost:9003
#
# 说明：
# - 首次启动会自动执行 prisma migrate deploy + db:seed + seed-rich-data
# - seed 脚本使用 upsert，重复执行不会重复插入数据
# - 前端 dev server 请在容器外单独启动，避免 HMR 与卷映射冲突

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentpro-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentpro
      POSTGRES_PASSWORD: talentpro_dev
      POSTGRES_DB: talentpro
    ports:
      - "5433:5432"
    volumes:
      - talentpro_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentpro -d talentpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentpro-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "6380:6379"
    volumes:
      - talentpro_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: talentpro-meilisearch-dev
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: talentpro_meili_master_key
    ports:
      - "7700:7700"
    volumes:
      - talentpro_meilisearch_dev:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: talentpro-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: talentpro
      MINIO_ROOT_PASSWORD: talentpro_minio_dev
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - talentpro_minio_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 数据初始化服务：先跑 migration，再跑 seed，完成后退出
  seed:
    image: node:22
    container_name: talentpro-seed-dev
    working_dir: /app
    volumes:
      - ./talentpro-backend:/app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://talentpro:talentpro_dev@postgres:5432/talentpro?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-a-random-string-at-least-32-chars
      PII_ENCRYPTION_KEY: change-me-to-a-random-string-at-least-32-chars
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: talentpro_meili_master_key
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: talentpro
      MINIO_SECRET_KEY: talentpro_minio_dev
      SEED_ADMIN_PASSWORD: TalentPro@123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: >
      sh -c "npm install --include=dev &&
             npx prisma migrate deploy &&
             npx prisma generate &&
             npm run db:seed &&
             npm run db:seed:rich &&
             echo '✅ Seed completed'"

  api:
    image: node:22
    container_name: talentpro-api-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./talentpro-backend:/app
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      APP_PORT: 4000
      APP_FRONTEND_URL: http://localhost:8080
      APP_CORS_ORIGINS: http://localhost:8080,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3457
      DATABASE_URL: postgresql://talentpro:talentpro_dev@postgres:5432/talentpro?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-a-random-string-at-least-32-chars
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PII_ENCRYPTION_KEY: change-me-to-a-random-string-at-least-32-chars
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: talentpro_meili_master_key
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: talentpro
      MINIO_SECRET_KEY: talentpro_minio_dev
      STORAGE_TYPE: local
      UPLOAD_DIR: ./uploads
      STORAGE_BASE_URL: /uploads
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM_NAME: TalentPro
      MAIL_FROM_ADDRESS: noreply@talentpro.cn
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 500
      THROTTLE_STRICT_TTL: 60000
      THROTTLE_STRICT_LIMIT: 100
      THROTTLE_AUTH_TTL: 60000
      THROTTLE_AUTH_LIMIT: 10
      THROTTLE_SEARCH_TTL: 60000
      THROTTLE_SEARCH_LIMIT: 60
      THROTTLE_LEAD_TTL: 3600000
      THROTTLE_LEAD_LIMIT: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command: >
      sh -c "npm install --include=dev &&
             npx prisma generate &&
             npm run start:dev"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  talentpro_postgres_dev:
  talentpro_redis_dev:
  talentpro_meilisearch_dev:
  talentpro_minio_dev:
