name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify-lockfiles:
    name: Verify dependency lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify root lockfile
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - name: Verify admin lockfile
        run: cd talentpro-admin && npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - name: Verify backend lockfile
        run: cd talentpro-backend && npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json

  test-frontend:
    needs: [verify-lockfiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Security audit — high/critical gate
        run: npm audit --audit-level=high
      - name: Security audit — moderate report
        run: npm audit --audit-level=moderate --json > npm-audit.json || true
      - name: Lint
        run: npm run lint
      - name: Inject build version
        run: echo "{\"version\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/version.json
      - run: npm run build
      - name: Validate design token sync
        run: node scripts/validate-tokens-sync.js
      - name: Validate version sync
        run: npm run validate:versions
      - name: Run live AI evaluation gate
        env:
          AI_EVAL_PROVIDER: ${{ secrets.AI_EVAL_PROVIDER }}
          AI_EVAL_MODEL: ${{ secrets.AI_EVAL_MODEL }}
          AI_EVAL_INPUT_USD_PER_1M: ${{ secrets.AI_EVAL_INPUT_USD_PER_1M }}
          AI_EVAL_OUTPUT_USD_PER_1M: ${{ secrets.AI_EVAL_OUTPUT_USD_PER_1M }}
          AI_EVAL_REQUIRE_COST: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:ai-eval
      - run: npx vitest run --coverage
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Require checked-in visual baselines
        shell: bash
        run: |
          expected=12
          actual=$(find e2e -type f -path '*-snapshots/*.png' | wc -l | tr -d ' ')
          test "$actual" -ge "$expected" || { echo "Missing visual baselines: found $actual, expected at least $expected. Run 'npm run test:visual -- --update-snapshots' locally and commit the snapshots."; exit 1; }
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
      - name: Upload frontend build artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: .output/public/
          retention-days: 30
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  test-backend:
    needs: [verify-lockfiles]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentpro
          POSTGRES_PASSWORD: talentpro_dev
          POSTGRES_DB: talentpro
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: cd talentpro-backend && npm ci
      - name: Security audit — high/critical gate
        run: cd talentpro-backend && npm audit --audit-level=high
      - name: Security audit — moderate report
        run: cd talentpro-backend && npm audit --audit-level=moderate --json > npm-audit.json || true
      - name: Lint
        run: cd talentpro-backend && npm run lint
      - run: cd talentpro-backend && npx prisma generate
      - run: cd talentpro-backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://talentpro:talentpro_dev@localhost:5432/talentpro?schema=public
      - run: cd talentpro-backend && npm run build
      - name: Inject build version
        run: echo "{\"version\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > talentpro-backend/dist/version.json
      - run: cd talentpro-backend && npm run test:cov
      - name: Check backend coverage threshold
        run: cd talentpro-backend && npx jest --coverage --coverageThreshold='{"global":{"branches":50,"functions":60,"lines":60,"statements":60}}'
      - run: cd talentpro-backend && npm run test:e2e
        env:
          DATABASE_URL: postgresql://talentpro:talentpro_dev@localhost:5432/talentpro?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-ci
          STORAGE_SIGNING_SECRET: test-storage-signing-secret-ci-32-chars-minimum
          PII_ENCRYPTION_KEY: test-pii-encryption-key-ci-32-chars-minimum
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: talentpro-backend/coverage/
          retention-days: 14

  build-admin:
    needs: [verify-lockfiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: cd talentpro-admin && npm ci
      - name: Security audit — high/critical gate
        run: cd talentpro-admin && npm audit --audit-level=high
      - name: Security audit — moderate report
        run: cd talentpro-admin && npm audit --audit-level=moderate --json > npm-audit.json || true
      - name: Inject build version
        run: |
          mkdir -p talentpro-admin/public
          echo "{\"version\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > talentpro-admin/public/version.json
      - run: cd talentpro-admin && npm run test
      - run: cd talentpro-admin && npm run build
      - name: Upload admin build artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: talentpro-admin/dist/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, build-admin]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .output/public/
      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: talentpro-admin/dist/
      - name: Build frontend Docker image
        run: |
          docker build -t talentpro-web:${{ github.sha }} -f docker/Dockerfile.frontend .
          docker tag talentpro-web:${{ github.sha }} talentpro-web:latest
      - name: Build backend Docker image
        run: |
          cd talentpro-backend
          docker build -t talentpro-api:${{ github.sha }} -f docker/Dockerfile .
          docker tag talentpro-api:${{ github.sha }} talentpro-api:latest
      - name: Push Docker images
        if: vars.DOCKER_REGISTRY != ''
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin "${{ vars.DOCKER_REGISTRY }}"
          for img in talentpro-web talentpro-api; do
            docker tag ${img}:${{ github.sha }} ${{ vars.DOCKER_REGISTRY }}/${img}:${{ github.sha }}
            docker tag ${img}:${{ github.sha }} ${{ vars.DOCKER_REGISTRY }}/${img}:latest
            docker push ${{ vars.DOCKER_REGISTRY }}/${img}:${{ github.sha }}
            docker push ${{ vars.DOCKER_REGISTRY }}/${img}:latest
          done
      - name: Deploy frontend to OSS
        if: vars.OSS_BUCKET != ''
        run: |
          npm install -g @alicloud/ossutil
          ossutil cp -rf .output/public/ oss://${{ vars.OSS_BUCKET }}/
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      - name: Deploy admin to OSS
        if: vars.OSS_ADMIN_BUCKET != ''
        run: |
          npm install -g @alicloud/ossutil
          ossutil cp -rf talentpro-admin/dist/ oss://${{ vars.OSS_ADMIN_BUCKET }}/
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      - name: Create deployment tag
        run: echo "Deployed version ${{ github.sha }} from branch ${{ github.ref_name }}"
