name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      # 安全审计：检查依赖漏洞（moderate 及以上级别）
      # 发现漏洞时不会中断构建，但会在日志中高亮显示
      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # 代码规范检查
      - name: Lint
        run: npm run lint

      # 注入构建版本信息（前端通过 public/ 自动复制到 dist）
      - name: Inject build version
        run: |
          echo "{\"version\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/version.json

      - run: npm run build

      # Token 双源同步校验
      - name: Validate design token sync
        run: node scripts/validate-tokens-sync.js

      - run: npx vitest run --coverage
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          name: frontend-dist
          path: dist/
          retention-days: 30
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Lighthouse 性能审计
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentpro
          POSTGRES_PASSWORD: talentpro_dev
          POSTGRES_DB: talentpro
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: cd talentpro-backend && npm ci

      # 安全审计：检查后端依赖漏洞
      - name: Security audit
        run: cd talentpro-backend && npm audit --audit-level=moderate
        continue-on-error: true

      # 代码规范检查
      - name: Lint
        run: cd talentpro-backend && npm run lint

      - run: cd talentpro-backend && npx prisma generate
      - run: cd talentpro-backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://talentpro:talentpro_dev@localhost:5432/talentpro?schema=public
      - run: cd talentpro-backend && npm run build

      # 注入构建版本信息到后端产物
      - name: Inject build version
        run: |
          echo "{\"version\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > talentpro-backend/dist/version.json

      - run: cd talentpro-backend && npm run test:cov
      - name: Check backend coverage threshold
        run: |
          cd talentpro-backend
          npx jest --coverage --coverageThreshold='{"global":{"branches":50,"functions":60,"lines":60,"statements":60}}'
      - run: cd talentpro-backend && npm run test:e2e
        env:
          DATABASE_URL: postgresql://talentpro:talentpro_dev@localhost:5432/talentpro?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-ci
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: talentpro-backend/coverage/
          retention-days: 14

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: cd talentpro-admin && npm ci

      # 安全审计：检查 admin 依赖漏洞
      - name: Security audit
        run: cd talentpro-admin && npm audit --audit-level=moderate
        continue-on-error: true

      # 注入构建版本信息（admin 通过 public/ 自动复制到 dist）
      - name: Inject build version
        run: |
          echo "{\"version\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > talentpro-admin/public/version.json

      - run: cd talentpro-admin && npm run build
      - name: Upload admin build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          name: admin-dist
          path: talentpro-admin/dist/
          retention-days: 30

  # CD 部署阶段（master 分支且测试通过后触发）
  deploy:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, build-admin]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: talentpro-admin/dist/

      # 构建并推送后端 Docker 镜像（需要配置 Docker Registry 认证 Secrets）
      - name: Build backend Docker image
        run: |
          cd talentpro-backend
          docker build -t talentpro-api:${{ github.sha }} -f docker/Dockerfile .
          docker tag talentpro-api:${{ github.sha }} talentpro-api:latest
      # - name: Push backend Docker image
      #   run: |
      #     echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin <registry>
      #     docker push <registry>/talentpro-api:${{ github.sha }}
      #     docker push <registry>/talentpro-api:latest

      # 前端静态资源部署（需要配置目标环境：OSS / S3 / Vercel / Netlify 等）
      # - name: Deploy frontend to OSS
      #   run: |
      #     npm install -g @alicloud/ossutil
      #     ossutil cp -rf dist/ oss://talentpro-static/
      #   env:
      #     OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      #     OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      # Admin 后台部署（需要配置目标环境）
      # - name: Deploy admin to OSS
      #   run: |
      #     npm install -g @alicloud/ossutil
      #     ossutil cp -rf talentpro-admin/dist/ oss://talentpro-admin-static/
      #   env:
      #     OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      #     OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      # 标记部署版本（可扩展为 GitHub Release 或发送部署通知）
      - name: Create deployment tag
        run: |
          echo "Deployed version ${{ github.sha }} from branch ${{ github.ref_name }}"
          echo "Build artifacts:"
          echo "  - frontend-dist/"
          echo "  - admin-dist/"
          echo "  - talentpro-api:${{ github.sha }}"
